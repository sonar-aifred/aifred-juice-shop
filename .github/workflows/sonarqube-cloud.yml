name: "SonarQube Cloud"
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
env:
  NODE_AUTH_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }} # npm auth for the Artifactory registry
  NODE_DEFAULT_VERSION: 24
  NPM_VERSION: 11.19.1
  NODE_OPTIONS: "--max_old_space_size=4096"
jobs:
  coverage-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0 # full history for accurate blame and new code detection
      - name: "Use Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
          registry-url: https://repox.jfrog.io/artifactory/api/npm/npm/
      - name: "Install application"
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm ci --ignore-scripts
          npm rebuild sqlite3 # native module, needs its install script
          npm ci --ignore-scripts --prefix frontend
      - name: "Build frontend and server"
        run: npm run build
      - name: "Run server unit tests with coverage"
        run: npm run test:server:coverage
      - name: "Run API tests with coverage"
        env:
          NODE_ENV: test
        run: npm run test:api:coverage
      - name: "Run frontend unit tests with coverage"
        run: npm run test:frontend:coverage
      - name: "Make frontend coverage paths relative to project root"
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/frontend/lcov.info
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

sonar.organization=sonar-aifred
sonar.projectKey=sonar-aifred_aifred-juice-shop
sonar.host.url=https://sonarcloud.io

sonar.sources=app.ts,server.ts,routes,lib,models,data,config,views,frontend/src
sonar.tests=test,frontend/src/app
sonar.test.inclusions=test/**,frontend/src/**/*.spec.ts
